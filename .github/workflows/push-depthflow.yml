name: Push DepthFlow model to Replicate

on:
  push:
    branches:
      - main
    paths:
      - "cog/**"
      - ".github/workflows/push-depthflow.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate
        working-directory: cog
        run: cog push r8.im/forwork255-cmyk/warqana-depthflow
